        .cigarette-mascot {

            border: none;
            border-radius: 14px;
            padding: 16px 64px;
            cursor: pointer;
            letter-spacing: 3px;
            -webkit-appearance: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-shadow: 0 6px 0 #3D6B3C, 0 8px 20px rgba(61,107,60,0.25);
            transform: translateY(0);
            transition: all 0.08s ease;
            position: relative;

        // ── 爱喜（进口）──
        { name: '爱喜（经典）', brand: '爱喜', price: '20元以下', origin: '进口', thickness: '细支', mood: ['想放松一下'], taste: ['抽点柔和的', '抽点口水烟（少尼古丁）'], image: 'images/爱喜（经典）.png', desc: '韩系细支' },

        // ── 宝亨（进口）──
        { name: '宝亨（原味）', brand: '宝亨', price: '20-50元', origin: '进口', thickness: '常规', mood: ['想放松一下', '一个人呆着'], taste: ['抽点柔和的'], image: 'images/宝亨（原味）.png', desc: '韩系混合' }
    ];

    // ===== 问题列表 =====
    var questions = [
        { text: '今天的预算？', field: 'price', options: ['20元以下', '20-50元', '50元以上', '无所谓'] },
        { text: '国产还是进口？', field: 'origin', options: ['国产', '进口', '都行'] },
        { text: '喜欢什么粗细？', field: 'thickness', options: ['常规烟', '细支', '中支', '无所谓'] },
        { text: '今天心情如何？', field: 'mood', options: ['想放松一下', '一个人呆着', '和朋友在一起', '无所谓'] },
        { text: '偏好什么口感？', field: 'taste', options: ['抽点够劲的', '抽点柔和的', '抽点甜的', '抽点口水烟（少尼古丁）', '无所谓'] }
    ];

    var currentStep = 0;
    var answers = [];

    var tipLink = document.getElementById('tip-link');

    function showPage(page) {
        [pageHome, pageQuiz, pageResult].forEach(function(p) { p.classList.remove('active'); });
        page.classList.add('active');
        wechatPromo.style.display = (page === pageHome) ? 'flex' : 'none';
        if (page === pageHome) wechatPromo.classList.add('on-green');
        else wechatPromo.classList.remove('on-green');
        tipLink.style.display = (page === pageResult) ? 'block' : 'none';
    }

    function filterCigarettes() {
        var pool = cigarettes.slice();
        var originAnswer = answers[1];
        if (originAnswer === '国产') pool = pool.filter(function(c) { return c.origin === '国产'; });
        else if (originAnswer === '进口') pool = pool.filter(function(c) { return c.origin === '进口'; });

        var filterOrder = [
            { index: 0, field: 'price' },
            { index: 2, field: 'thickness' },
            { index: 3, field: 'mood' },
            { index: 4, field: 'taste' }
        ];

        for (var i = 0; i < filterOrder.length; i++) {
            var answer = answers[filterOrder[i].index];
            if (!answer || answer === '无所谓') continue;
            var field = filterOrder[i].field;
            var filtered;
            if (field === 'price' || field === 'thickness') {
                filtered = pool.filter(function(c) { return c[field] === answer; });
            } else {
                filtered = pool.filter(function(c) { return c[field].indexOf(answer) !== -1; });
            }
            if (filtered.length >= 3) pool = filtered;
        }
        return pool;
    }

    function pickRandom(pool) {
        var arr = pool.slice(), result = [];
        var count = Math.min(3, arr.length);
        for (var i = 0; i < count; i++) {
            var idx = Math.floor(Math.random() * arr.length);
            result.push(arr[idx]);
            arr.splice(idx, 1);
        }
        return result;
    }

    function getImagePath(cig) {
        if (cig.image) return cig.image;
        return 'images/' + cig.name + '.jpg';
    }

    var brandColors = {
        '中华':'#C41E2A','玉溪':'#8B1A1A','黄鹤楼':'#1B3A5C','利群':'#C41E2A','芙蓉王':'#D4A843',
        '云烟':'#C41E2A','南京':'#C8963E','苏烟':'#8B1A1A','红塔山':'#C41E2A','泰山':'#2D5A27',
        '贵烟':'#5C3D2E','娇子':'#2565AE','黄山':'#C8963E','七匹狼':'#1E3A5F','双喜':'#D4213D',
        '黄金叶':'#C8963E','长白山':'#2D5A27','中南海':'#5D6D7E','黄果树':'#C8963E','红河':'#C41E2A',
        '兰州':'#1A3A6B','白沙':'#5D6D7E','万宝路':'#D52B1E','555':'#1B3A5C','七星':'#2C3E50',
        '大卫杜夫':'#1C1C1C','爱喜':'#27AE60','宝亨':'#8B6914'
    };

    function showResults() {
        var pool = filterCigarettes();
        var picks = pickRandom(pool);
        var container = document.getElementById('result-cards');
        container.innerHTML = '';
        picks.forEach(function(cig) {
            var imgPath = getImagePath(cig);
            var color = brandColors[cig.brand] || '#5D6D7E';
            var initials = cig.brand.substring(0, 2);

            // 卡片容器
            var card = document.createElement('div');
            card.className = 'result-card';

            // 图片
            var img = document.createElement('img');
            img.className = 'result-card-img';
            img.src = imgPath;
            img.alt = cig.name;
            img.setAttribute('loading', 'lazy');

            // 占位 div（图片加载失败时显示）
            var placeholder = document.createElement('div');
            placeholder.className = 'result-card-placeholder';
            placeholder.style.display = 'none';
            placeholder.style.alignItems = 'center';
            placeholder.style.justifyContent = 'center';
            placeholder.style.backgroundColor = color;
            placeholder.style.borderRadius = '8px';
            placeholder.style.flexShrink = '0';
            placeholder.style.width = '60px';
            placeholder.style.height = '80px';
            var phSpan = document.createElement('span');
            phSpan.style.color = 'white';
            phSpan.style.fontSize = '16px';
            phSpan.style.fontWeight = 'bold';
            phSpan.textContent = initials;
            placeholder.appendChild(phSpan);

            // 图片加载失败 → 显示占位
            img.onerror = function() {
                img.style.display = 'none';
                placeholder.style.display = 'flex';
            };

            // 信息区
            var info = document.createElement('div');
            info.className = 'result-card-info';

            var nameDiv = document.createElement('div');
            nameDiv.className = 'result-card-name';
            nameDiv.textContent = cig.name;

            var descDiv = document.createElement('div');
            descDiv.className = 'result-card-desc';
            descDiv.textContent = cig.desc || '';

            var metaDiv = document.createElement('div');
            metaDiv.className = 'result-card-meta';
            metaDiv.textContent = cig.brand + ' · ' + cig.price + ' · ' + cig.thickness;

            info.appendChild(nameDiv);
            info.appendChild(descDiv);
            info.appendChild(metaDiv);

            card.appendChild(img);
            card.appendChild(placeholder);
            card.appendChild(info);
            container.appendChild(card);
        });
    }

    function renderQuestion() {
        if (currentStep >= questions.length) {
            showPage(pageResult);
            showResults();
            return;
        }
        var q = questions[currentStep];
        // 进度条
        var pct = Math.round((currentStep / questions.length) * 100);
        document.getElementById('quiz-progress-bar').style.width = pct + '%';
        // 提示
        document.getElementById('question-hint').textContent = '第 ' + (currentStep + 1) + ' / ' + questions.length + ' 题';
        questionText.textContent = q.text;
        optionsList.innerHTML = '';
        q.options.forEach(function(option, index) {
            var btn = document.createElement('button');
            btn.className = 'option-btn';
            var num = document.createElement('span');
            num.className = 'option-number';
            num.textContent = (index + 1);
            btn.appendChild(num);
            var label = document.createElement('span');
            label.textContent = option;
            btn.appendChild(label);
            btn.addEventListener('click', function() { selectOption(option); });
            optionsList.appendChild(btn);
        });
    }

    function selectOption(option) {
        answers.push(option);
        currentStep++;
        renderQuestion();
    }

    document.getElementById('btn-start').addEventListener('click', function() {
        currentStep = 0;
        answers = [];
        showPage(pageQuiz);
        renderQuestion();
    });

    document.getElementById('btn-retry').addEventListener('click', function() {
        showPage(pageHome);
    });
</script>
