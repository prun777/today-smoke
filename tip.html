<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鼓励一下作者</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #FAF7F2;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container { max-width: 400px; }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .sub {
            font-size: 14px;
            color: #999;
            margin-bottom: 32px;
        }
        img {
            max-width: 280px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .back {
            display: inline-block;
            margin-top: 32px;
            color: #5B8C5A;
            text-decoration: none;
            font-size: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>谢谢你的鼓励 ❤️</h1>
    <p class="sub">长按识别二维码赞赏</p>
    <img src="赞赏码.jpg" alt="赞赏码">
    <br>
    <a class="back" href="index.html">← 返回</a>
</div>

</html>
